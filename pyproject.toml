[project]
name = "gpt2-inference-engine"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
